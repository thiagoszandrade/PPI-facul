<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrossel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Bem vindo</h1>
        <p></p>
    </header>
    <section class="carrossel">
        <img src="img/img1.jpg" alt="" class="slide active">
        <img src="img/img2.jpg" alt="" class="slide active">
        <img src="img/img3.jpg" alt="" class="slide active">
    </section>
    <section class="contato">
        <h2>Formulário de Contato</h2>
        <form action="" id="frmContato">
            <input type="text" name="nomeContato" id="nomeContato" placeholder="Digite seu nome..." required>
            <input type="email" name="email" placeholder="Digite seu e-mail..." required>
            <textarea name="mensagem" placeholder="Digite sua mensagem..." required></textarea>
            <button type="submit">Enviar</button>
            <button type="reset">Apagar</button>
        </form>
    </section>
    <section class="mapa">
        <h2>Nos encontre</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1950.5722946299427!2d-50.436081052559764!3d-22.648717971463054!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9495398f103cdbd3%3A0xf49e6748feb2ceaa!2sFaculdade%20de%20Tecnologia%20de%20Assis!5e0!3m2!1spt-BR!2sbr!4v1790638288581!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </section>
    <section class="wpp">
        <a href="https://wa.me/5518997632456" target="_blank">Fale conosco pelo WhatsApp</a>
    </section>
    <footer>
        <p>@Copy;2026 Meu Negócio Local. Todos os direitos reservados</p>
    </footer>
</body>
</html>
